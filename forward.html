<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正激电路各阶段电流流向</title><style>
:root{--border:#d1d5db;--text:#17253b;--muted:#61738a}
body{margin:0;padding:16px;background:#fff;font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;color:var(--text)}
.app{max-width:1250px;margin:auto}.stages{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.stages button{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:8px;padding:9px 12px;font-family:inherit;font-size:13px;cursor:pointer;min-height:40px}.stages button[aria-pressed=true]{background:#eff6ff;border-color:#60a5fa;font-weight:700}
.status{font-size:13px;color:var(--muted);margin:7px 0 10px}.frame{background:#fff;border:1px solid var(--border);border-radius:11px;overflow-x:auto;padding:5px}.frame svg{width:100%;height:auto;min-width:960px;display:block}
.w{fill:none;stroke:#253449;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#253449;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}.node{fill:#253449}.name{font-size:21px;font-weight:700;fill:#17253b}.small{font-size:13px;fill:#607187}.flow{display:none;fill:none;stroke-width:8;opacity:.73;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12 16;animation:move .95s linear infinite}.blue{stroke:#2563eb}.green{stroke:#059669}.purple{stroke:#8b5cf6}.orange{stroke:#ea580c}.gold{stroke:#ca8a04}.ar{fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}.ar.gold{stroke:#ca8a04}.ar.green{stroke:#059669}.ar.orange{stroke:#ea580c}.ar.purple{stroke:#8b5cf6}.ar.blue{stroke:#2563eb}
@keyframes move{to{stroke-dashoffset:-56}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}.legend{display:flex;gap:10px 18px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:9px 0}.legend i{display:inline-block;width:13px;height:5px;border-radius:3px;margin-right:5px;vertical-align:middle}.details{padding:10px 14px;border:1px solid var(--border);border-radius:10px;margin-top:10px;font-size:13px;line-height:1.8}
</style></head><body><div class="app" id="app">
<div class="stages">
<button data-state="on_lo" aria-pressed="true">① ON 前半 · C1 放电</button>
<button data-state="on_hi" aria-pressed="false">② ON 后半 · C1 充电</button>
<button data-state="off_hi" aria-pressed="false">③ OFF 前段 · C1 充电</button>
<button data-state="off_lo" aria-pressed="false">④ OFF 复位后段 · C1 放电</button>
<button data-state="off_end" aria-pressed="false">⑤ 复位完成 · C1 放电</button>
<button data-state="dcm" aria-pressed="false">⑥ DCM 空闲</button>
</div>
<div class="status" id="status">ON 前半：IL &lt; Io；电感向负载供电，C1 同时放电补足电流</div>
<div class="frame"><svg id="schematic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" role="img" aria-label="正激变换器，六个阶段整体电流路径，包含C1充放电方向">
<defs>
 <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r=".7" fill="#d8e1ed"/></pattern>
 <marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="11" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="none" stroke="#2563eb" stroke-width="2.6"/></marker>
 <marker id="arr-green" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="11" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="none" stroke="#059669" stroke-width="2.6"/></marker>
 <marker id="arr-purple" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="11" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="none" stroke="#8b5cf6" stroke-width="2.6"/></marker>
 <marker id="arr-orange" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="11" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="none" stroke="#ea580c" stroke-width="2.6"/></marker>
 <marker id="arr-gold" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="11" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="none" stroke="#ca8a04" stroke-width="2.6"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="680" fill="#fff"/>
<rect x="12" y="9" width="1376" height="651" rx="12" fill="url(#grid)"/>
<text x="700" y="40" text-anchor="middle" font-size="25" font-weight="800" fill="#17253b">单管正激电路 · 开关周期内电流流向</text>
<text x="700" y="70" text-anchor="middle" font-size="15" fill="#64748b">C1 已直接并入各阶段 · 充/放电取决于 IL 与 Io 的大小关系</text>

<!-- highlighted current segments (below black schematic) -->
<g id="hl-primary">
 <path class="flow blue" d="M125 580V385 M125 293V145H535 V215 C566 225 566 246 535 256 C566 266 566 286 535 296 C566 306 566 326 535 336 V350H475 Q445 322 415 350H382V395 M382 500V580H125"/>
 <path class="ar blue" marker-end="url(#arr-blue)" d="M231 145H266"/>
 <path class="ar blue" marker-end="url(#arr-blue)" d="M382 517V546"/>
</g>
<g id="hl-secondary">
 <path class="flow green" d="M688 580V336 C657 326 657 306 688 296 C657 286 657 266 688 256 C657 246 657 225 688 215H787H842H910H953 C968 180 989 180 1004 215 C1019 180 1040 180 1055 215 C1070 180 1091 180 1106 215H1278V376 M1278 482V580H688"/>
 <path class="ar green" marker-end="url(#arr-green)" d="M727 215H752"/>
 <path class="ar green" marker-end="url(#arr-green)" d="M1278 292V325"/>
</g>
<g id="hl-reset">
 <path class="flow purple" d="M535 580 V530 C566 520 566 500 535 490 C566 480 566 460 535 450 C566 440 566 420 535 410 H445V403 M445 369V145 H125 V293 M125 385 V580 H535"/>
 <path class="ar purple" marker-end="url(#arr-purple)" d="M506 487V455"/>
 <path class="ar purple" marker-end="url(#arr-purple)" d="M445 292V261"/>
</g>
<g id="hl-freewheel">
 <path class="flow orange" d="M910 580V415 M910 374V215H953 C968 180 989 180 1004 215 C1019 180 1040 180 1055 215 C1070 180 1091 180 1106 215H1278V376 M1278 482V580H910"/>
 <path class="ar orange" marker-end="url(#arr-orange)" d="M910 302V270"/>
 <path class="ar orange" marker-end="url(#arr-orange)" d="M1278 297V329"/>
</g>
<g id="hl-cap-discharge">
 <path class="flow gold" d="M1165 580V423 M1165 394V215H1278V376 M1278 482V580H1165"/>
 <path class="ar gold" marker-end="url(#arr-gold)" d="M1192 334V296"/>
 <path class="ar gold" marker-end="url(#arr-gold)" d="M1213 215H1244"/>
 <text x="1195" y="365" font-size="16" font-weight="700" fill="#a16207">IC ↑</text>
</g>
<g id="hl-cap-charge">
 <path class="flow gold" d="M1106 215H1165V394 M1165 423V580"/>
 <path class="ar gold" marker-end="url(#arr-gold)" d="M1192 294V337"/>
 <text x="1195" y="365" font-size="16" font-weight="700" fill="#a16207">IC ↓</text>
</g>

<!-- base schematic -->
<circle cx="125" cy="340" r="45" fill="#fff" stroke="#253449" stroke-width="3.2"/>
<path class="w" d="M125 295V145H535 M125 385V580H535"/>
<path class="thin" d="M115 327H135 M125 317V337 M115 353H135"/>
<text x="125" y="269" text-anchor="middle" class="name">Vin</text>

<!-- Primary p1: top section -->
<path class="w" d="M535 145V215 C566 225 566 246 535 256 C566 266 566 286 535 296 C566 306 566 326 535 336 V350 H475"/>
<circle cx="516" cy="222" r="5.5" class="node"/>
<text x="490" y="288" text-anchor="end" class="name">p1</text>
<path class="w" d="M415 350H382V395"/>
<!-- crossing jump at D1 wire -->
<path d="M475 350Q445 322 415 350" fill="none" stroke="#fff" stroke-width="12"/>
<path class="w" d="M475 350Q445 322 415 350"/>

<!-- Reset p2 lower primary -->
<path class="w" d="M535 410 C566 420 566 440 535 450 C566 460 566 480 535 490 C566 500 566 520 535 530V580"/>
<circle cx="516" cy="521" r="5.5" class="node"/>
<text x="490" y="477" text-anchor="end" class="name">p2</text>

<!-- core -->
<path d="M610 185V553 M628 185V553" fill="none" stroke="#6a7c90" stroke-width="6.5" stroke-linecap="round"/>
<text x="619" y="150" text-anchor="middle" class="name">T1</text>

<!-- s1 same position as p1 -->
<path class="w" d="M688 215 C657 225 657 246 688 256 C657 266 657 286 688 296 C657 306 657 326 688 336V580"/>
<circle cx="707" cy="222" r="5.5" class="node"/>
<text x="711" y="291" class="name">s1</text>

<!-- D1: vertical, cathode up -->
<path class="w" d="M445 145V369 M424 369H466"/>
<polygon points="445,374 423,403 467,403" fill="#fff" stroke="#253449" stroke-width="3.2" stroke-linejoin="round"/>
<path class="w" d="M445 403V410H535"/>
<circle cx="445" cy="145" r="5" class="node"/>
<text x="469" y="397" class="name">D1</text>

<!-- Q1 NMOS screenshot-style gate + D/S -->
<path class="w" d="M382 395V423 M382 485V580"/>
<path class="w" d="M354 415V496"/>
<path class="w" d="M382 423V439 M382 468V485"/>
<path class="thin" d="M390 454H366 M376 446L366 454L376 462"/>
<circle cx="205" cy="454" r="8" fill="#fff" stroke="#253449" stroke-width="3"/>
<path class="w" d="M213 454H354"/>
<text x="190" y="412" class="name">PWM</text>
<text x="404" y="441" class="name">Q1</text>
<text x="405" y="467" class="small">NMOS</text>

<!-- PGND -->
<circle cx="382" cy="580" r="5.5" class="node"/>
<circle cx="535" cy="580" r="5.5" class="node"/>
<path class="w" d="M270 580V603 M241 603H299 M252 615H288 M263 627H277"/>
<text x="308" y="615" class="small">PGND</text>

<!-- D2 diode -->
<path class="w" d="M688 215H787"/>
<polygon points="787,194 787,236 834,215" fill="#fff" stroke="#253449" stroke-width="3.2"/>
<path class="w" d="M842 192V238 M842 215H910"/>
<text x="814" y="170" text-anchor="middle" class="name">D2</text>

<!-- L1 -->
<circle cx="910" cy="215" r="5.5" class="node"/>
<path class="w" d="M910 215H953 C968 180 989 180 1004 215 C1019 180 1040 180 1055 215 C1070 180 1091 180 1106 215H1278"/>
<text x="1027" y="161" text-anchor="middle" class="name">L1</text>

<!-- D3 freewheel -->
<path class="w" d="M910 215V374 M888 374H932"/>
<polygon points="910,380 888,415 932,415" fill="#fff" stroke="#253449" stroke-width="3.2"/>
<path class="w" d="M910 415V580"/>
<text x="942" y="404" class="name">D3</text>

<!-- output capacitor -->
<circle cx="1165" cy="215" r="5.5" class="node"/>
<path class="w" d="M1165 215V394 M1132 394H1198 M1132 423H1198 M1165 423V580"/>
<text x="1116" y="443" text-anchor="end" class="name">C1</text>

<!-- load -->
<circle cx="1278" cy="215" r="5.5" class="node"/>
<path class="w" d="M1278 215V376"/>
<rect x="1265" y="376" width="26" height="106" fill="#fff" stroke="#253449" stroke-width="3.2"/>
<path class="w" d="M1278 482V580"/>
<text x="1278" y="170" text-anchor="middle" class="name">Vout</text>
<text x="1306" y="434" class="name">R1</text>

<!-- secondary ground -->
<path class="w" d="M688 580H1278 M1013 580V603 M984 603H1042 M995 615H1031 M1006 627H1020"/>
<circle cx="910" cy="580" r="5.5" class="node"/>
<circle cx="1165" cy="580" r="5.5" class="node"/>
<text x="1051" y="615" class="small">SGND</text>
</svg></div>
<div class="legend">
<span><i style="background:#2563eb"></i>原边主电流</span><span><i style="background:#059669"></i>副边传能</span><span><i style="background:#8b5cf6"></i>励磁复位</span><span><i style="background:#ea580c"></i>输出续流</span><span><i style="background:#ca8a04"></i>C1 支路（向上放电 / 向下充电）</span>
</div>
<div class="details" id="description">① ON 前半：D2 导通，L1 电流上升但小于负载电流。C1 从正端向负载补电，电容电流沿 C1 支路向上。</div>
</div>
<script>
(()=>{
 const app=document.querySelector('#app');if(!app||app.dataset.ready)return;app.dataset.ready='1';
 const states={
 on_lo:{flows:['primary','secondary','cap-discharge'],status:'① ON 前半：IL < Io；电感供电不足的部分由 C1 放电补足。',text:'Q1、D2 导通；D1、D3 截止。L1 电流逐渐增大，但低于负载电流 Io，因此 C1 电流向上（放电）。'},
 on_hi:{flows:['primary','secondary','cap-charge'],status:'② ON 后半：IL > Io；L1 给负载供电，还有多余电流为 C1 充电。',text:'Q1、D2 仍导通，L1 电流继续增加。IL 超过 Io 后，C1 支路电流反向，流向电容正极（充电）。'},
 off_hi:{flows:['reset','freewheel','cap-charge'],status:'③ OFF 前段：磁芯复位、D3 续流同时进行；IL > Io，C1 继续充电。',text:'Q1、D2 截止；p2 经 D1 复位，D3 为 L1 续流。虽然 IL 开始下降，但仍高于 Io，C1 此时仍然充电。'},
 off_lo:{flows:['reset','freewheel','cap-discharge'],status:'④ OFF 复位后段：磁芯仍复位；IL < Io，C1 已转为放电。',text:'随着 IL 下降并低于 Io，C1 电流由向下变成向上。D1 此时还在复位导通，D3 继续续流。'},
 off_end:{flows:['freewheel','cap-discharge'],status:'⑤ 复位完成后：D1 截止，D3 继续续流；C1 放电。',text:'磁芯复位电流已归零，D1 截止；但 L1 仍有正电流经 D3 续流，IL < Io 时 C1 补充负载电流。'},
 dcm:{flows:['cap-discharge'],status:'⑥ DCM 空闲：L1 电流为零；只有 C1 向负载放电。',text:'这是轻载下 DCM 的独立示例，并非前面 CCM 周期内的连续第六阶段。D2、D3 无电流，C1 单独供电。'}
 };
 const ids=['primary','secondary','reset','freewheel','cap-discharge','cap-charge'];
 const buttons=[...app.querySelectorAll('button[data-state]')];
 function show(key){ids.forEach(i=>{app.querySelector('#hl-'+i).querySelectorAll('.flow,.ar,text').forEach(el=>el.style.display='none')});states[key].flows.forEach(i=>{app.querySelector('#hl-'+i).querySelectorAll('.flow,.ar,text').forEach(el=>el.style.display='block')});buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===key)));app.querySelector('#status').textContent=states[key].status;app.querySelector('#description').textContent=states[key].text;}
 buttons.forEach(b=>b.addEventListener('click',()=>show(b.dataset.state)));
 show('on_lo');
})();
</script></body></html>
