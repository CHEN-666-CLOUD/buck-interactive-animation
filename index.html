<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buck 完整电流路径交互动画</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif}
.wrap{max-width:1280px;margin:20px auto;padding:0 16px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}
.buttons{display:flex;flex-wrap:wrap;gap:8px}button{border:1px solid #d1d5db;background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer;font-size:14px}button.active{background:#eaf2ff;border-color:#93b4ff;font-weight:700}
.card{background:#fff;border:1px solid #d1d5db;border-radius:14px;padding:12px;overflow:auto}svg{display:block;min-width:900px;width:100%;height:auto}.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;font-size:14px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px}
</style>
</head>
<body>
<div class="wrap">
<div class="toolbar">
  <div><div style="font-size:20px;font-weight:700">Buck 完整电流路径 + 连续 VPWM / Vout 波形</div><div id="status" style="font-size:14px;color:#6b7280;margin-top:3px">① ON｜iL 上升｜iL &lt; iLoad｜C 放电</div></div>
  <div class="buttons"><button id="auto" class="active">自动播放</button><button id="pause">暂停</button><button class="state active" data-s="1">① ON｜C 放电</button><button class="state" data-s="2">② ON｜C 充电</button><button class="state" data-s="3">③ OFF｜C 充电</button><button class="state" data-s="4">④ OFF｜C 放电</button></div>
</div>
<div class="card">
<svg viewBox="0 0 1220 950" aria-label="Buck 电路完整电流路径和连续波形">
<defs>
<marker id="ain" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0891b2"/></marker>
<marker id="al" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
<marker id="ad" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#ea580c"/></marker>
<marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#059669"/></marker>
<marker id="ac" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7c3aed"/></marker>
<marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#be185d"/></marker>

</defs>
<text x="610" y="40" text-anchor="middle" font-size="29" font-weight="700">Buck 降压电路 · 完整电流路径与连续波形</text>
<text id="title" x="610" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">① PWM HIGH：S ON，iL 上升，C 放电</text>
<rect x="45" y="98" width="1130" height="450" rx="18" fill="#fcfcfc" stroke="#d1d5db" stroke-width="1.5"/>

<!-- Vin -->
<circle cx="140" cy="255" r="44" fill="#fff" stroke="#111827" stroke-width="3.5"/><line x1="140" y1="220" x2="140" y2="235" stroke="#111827" stroke-width="3"/><line x1="131" y1="227" x2="149" y2="227" stroke="#111827" stroke-width="3"/><line x1="132" y1="280" x2="148" y2="280" stroke="#111827" stroke-width="3"/>
<text x="140" y="190" text-anchor="middle" font-size="23" font-weight="700">Vin</text><text x="140" y="325" text-anchor="middle" font-size="14" fill="#6b7280">12 V</text>
<line x1="140" y1="211" x2="140" y2="143" stroke="#111827" stroke-width="4"/><line x1="140" y1="143" x2="275" y2="143" stroke="#111827" stroke-width="4"/><line x1="140" y1="299" x2="140" y2="455" stroke="#111827" stroke-width="4"/>

<!-- switch -->
<circle cx="275" cy="143" r="7" fill="#111827"/><circle cx="385" cy="143" r="7" fill="#111827"/><line id="sw" x1="282" y1="143" x2="378" y2="143" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
<text x="330" y="100" text-anchor="middle" font-size="24" font-weight="700">S</text><text id="pwmLabel" x="330" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">PWM HIGH</text>

<!-- L -->
<line x1="385" y1="143" x2="440" y2="143" stroke="#111827" stroke-width="4"/><circle cx="440" cy="143" r="8" fill="#111827"/><text x="440" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">SW</text>
<line x1="440" y1="143" x2="485" y2="143" stroke="#111827" stroke-width="4"/><path d="M485 143 C498 108 520 108 533 143 C546 108 568 108 581 143 C594 108 616 108 629 143 C642 108 664 108 677 143" fill="none" stroke="#111827" stroke-width="4"/><line x1="677" y1="143" x2="755" y2="143" stroke="#111827" stroke-width="4"/>
<text x="581" y="94" text-anchor="middle" font-size="24" font-weight="700">L</text><text x="581" y="182" text-anchor="middle" font-size="14" fill="#6b7280">470 μH</text>

<!-- output -->
<circle cx="755" cy="143" r="8" fill="#111827"/><line x1="755" y1="143" x2="1035" y2="143" stroke="#111827" stroke-width="4"/><text x="1035" y="106" text-anchor="middle" font-size="23" font-weight="700">Vout</text><text id="voutNow" x="1035" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">0.00 V</text>

<!-- diode -->
<line x1="440" y1="143" x2="440" y2="232" stroke="#111827" stroke-width="4"/><line x1="404" y1="232" x2="476" y2="232" stroke="#111827" stroke-width="5"/><path d="M406 318 L474 318 L440 256 Z" fill="#fff" stroke="#111827" stroke-width="4"/><line x1="440" y1="318" x2="440" y2="455" stroke="#111827" stroke-width="4"/>
<text x="492" y="270" font-size="22" font-weight="700">D</text><text x="492" y="295" font-size="14" fill="#6b7280">续流</text>

<!-- C -->
<line x1="755" y1="143" x2="755" y2="242" stroke="#111827" stroke-width="4"/><line x1="713" y1="242" x2="797" y2="242" stroke="#111827" stroke-width="5"/><line x1="713" y1="267" x2="797" y2="267" stroke="#111827" stroke-width="5"/><line x1="755" y1="267" x2="755" y2="455" stroke="#111827" stroke-width="4"/>
<text x="810" y="257" font-size="22" font-weight="700">C</text><text x="810" y="283" font-size="14" fill="#6b7280">470 μF</text>

<!-- load -->
<line x1="930" y1="143" x2="930" y2="212" stroke="#111827" stroke-width="4"/><path d="M930 212 l-18 15 36 23 -36 23 36 23 -36 23 36 23 -18 15" fill="none" stroke="#111827" stroke-width="4"/><line x1="930" y1="357" x2="930" y2="455" stroke="#111827" stroke-width="4"/>
<text x="983" y="269" font-size="21" font-weight="700">Rload</text><text x="983" y="295" font-size="14" fill="#6b7280">10 Ω</text>

<!-- ground -->
<line x1="140" y1="455" x2="930" y2="455" stroke="#111827" stroke-width="5"/><circle cx="440" cy="455" r="7" fill="#111827"/><circle cx="755" cy="455" r="7" fill="#111827"/><circle cx="930" cy="455" r="7" fill="#111827"/>
<line x1="590" y1="455" x2="590" y2="480" stroke="#111827" stroke-width="4"/><line x1="558" y1="480" x2="622" y2="480" stroke="#111827" stroke-width="4"/><line x1="569" y1="494" x2="611" y2="494" stroke="#111827" stroke-width="4"/><line x1="580" y1="508" x2="600" y2="508" stroke="#111827" stroke-width="4"/><text x="635" y="494" font-size="16" font-weight="700" fill="#374151">GND</text>

<!-- current paths -->
<path id="pin" d="M140 455 L140 299 L140 211 L140 143 L275 143 L385 143 L440 143" fill="none" stroke="#0891b2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ain)"/>
<path id="pil" d="M440 143 L485 143 C498 108 520 108 533 143 C546 108 568 108 581 143 C594 108 616 108 629 143 C642 108 664 108 677 143 L755 143" fill="none" stroke="#2563eb" stroke-width="9" stroke-linecap="round" marker-end="url(#al)"/>
<path id="pid" d="M440 455 L440 318 L440 256 L440 232 L440 143" fill="none" stroke="#ea580c" stroke-width="9" stroke-linecap="round" opacity="0" marker-end="url(#ad)"/>
<path id="pload" d="M755 143 L930 143 L930 455" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<path id="pcc" d="M755 143 L755 455" fill="none" stroke="#7c3aed" stroke-width="8" stroke-linecap="round" opacity="0" marker-end="url(#ac)"/>
<path id="pcd" d="M755 455 L755 143" fill="none" stroke="#7c3aed" stroke-width="8" stroke-linecap="round" marker-end="url(#ac)"/>
<path id="pg1" d="M930 455 L755 455" fill="none" stroke="#be185d" stroke-width="8" stroke-linecap="round" marker-end="url(#ag)"/>
<path id="pg2" d="M755 455 L440 455" fill="none" stroke="#be185d" stroke-width="8" stroke-linecap="round" marker-end="url(#ag)"/>
<path id="pg3" d="M440 455 L140 455" fill="none" stroke="#be185d" stroke-width="8" stroke-linecap="round" marker-end="url(#ag)"/>
<g id="gin"></g><g id="gil"></g><g id="gid"></g><g id="gload"></g><g id="gcc"></g><g id="gcd"></g><g id="gg1"></g><g id="gg2"></g><g id="gg3"></g>

<!-- waves -->
<rect x="70" y="575" width="1080" height="330" rx="16" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="95" y="604" font-size="15" font-weight="700" fill="#374151">连续实时波形</text><text x="1085" y="604" text-anchor="end" font-size="12" fill="#6b7280">向左滚动，右侧为当前时刻</text>
<text x="105" y="685" font-size="16" font-weight="700" fill="#4f46e5">VPWM</text><text x="168" y="644" text-anchor="end" font-size="12" fill="#6b7280">3.3 V</text><text x="168" y="703" text-anchor="end" font-size="12" fill="#6b7280">0 V</text><line x1="190" y1="703" x2="1040" y2="703" stroke="#9ca3af"/><line x1="190" y1="644" x2="1040" y2="644" stroke="#e5e7eb" stroke-dasharray="5 5"/>
<text x="105" y="820" font-size="16" font-weight="700" fill="#0f766e">Vout</text><text x="168" y="755" text-anchor="end" font-size="12" fill="#6b7280">6 V</text><text x="168" y="846" text-anchor="end" font-size="12" fill="#6b7280">0 V</text><line x1="190" y1="846" x2="1040" y2="846" stroke="#9ca3af"/><line x1="190" y1="767" x2="1040" y2="767" stroke="#d1d5db" stroke-dasharray="5 5"/><text x="1070" y="771" font-size="12" fill="#0f766e">≈5.43 V</text>
<g clip-path="url(#clip)"><path id="pwmWave" fill="none" stroke="#4f46e5" stroke-width="3.5"/><path id="voutWave" fill="none" stroke="#0f766e" stroke-width="3.5"/></g><line x1="1040" y1="625" x2="1040" y2="862" stroke="#dc2626" stroke-width="2.5"/><circle id="pwmDot" cx="1040" cy="644" r="6" fill="#dc2626" stroke="#fff" stroke-width="2"/><circle id="voutDot" cx="1040" cy="846" r="6" fill="#dc2626" stroke="#fff" stroke-width="2"/><text x="1040" y="884" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">现在</text><text x="615" y="892" text-anchor="middle" font-size="13" fill="#6b7280">Vout：0 V → 上升 → 最终稳定在约 5.43 V，稳定后只剩小纹波</text>
</svg>
</div>
<div class="legend"><span><i class="dot" style="background:#0891b2"></i>iin</span><span><i class="dot" style="background:#2563eb"></i>iL</span><span><i class="dot" style="background:#ea580c"></i>iD</span><span><i class="dot" style="background:#059669"></i>iLoad</span><span><i class="dot" style="background:#7c3aed"></i>iC</span><span><i class="dot" style="background:#be185d"></i>GND 回流</span></div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const P={in:$('#pin'),il:$('#pil'),id:$('#pid'),load:$('#pload'),cc:$('#pcc'),cd:$('#pcd'),g1:$('#pg1'),g2:$('#pg2'),g3:$('#pg3')};
const G={in:$('#gin'),il:$('#gil'),id:$('#gid'),load:$('#gload'),cc:$('#gcc'),cd:$('#gcd'),g1:$('#gg1'),g2:$('#gg2'),g3:$('#gg3')};
const col={in:'#0891b2',il:'#2563eb',id:'#ea580c',load:'#059669',cc:'#7c3aed',cd:'#7c3aed',g1:'#be185d',g2:'#be185d',g3:'#be185d'},dots={};
Object.keys(G).forEach(k=>{dots[k]=[];for(let i=0;i<6;i++){const q=document.createElementNS('http://www.w3.org/2000/svg','circle');q.setAttribute('r','5.7');q.setAttribute('fill',col[k]);q.setAttribute('stroke','#fff');q.setAttribute('stroke-width','2');G[k].appendChild(q);dots[k].push(q)}});
const states={1:{on:1,cap:'d',title:'① PWM HIGH：S ON，iL 上升，C 放电',status:'① ON｜iL 上升｜iL < iLoad｜C 放电'},2:{on:1,cap:'c',title:'② PWM HIGH：S ON，iL 上升，C 充电',status:'② ON｜iL 上升｜iL > iLoad｜C 充电'},3:{on:0,cap:'c',title:'③ PWM LOW：S OFF，iL 下降，C 充电',status:'③ OFF｜iL 下降｜iL > iLoad｜C 充电'},4:{on:0,cap:'d',title:'④ PWM LOW：S OFF，iL 下降，C 放电',status:'④ OFF｜iL 下降｜iL < iLoad｜C 放电'}};
let state=1,auto=true,paused=false,sim=0,last=performance.now();const period=.7,target=5.43,tau=3,windowSec=6.2,pwmHist=[],vHist=[];
function vis(k,on){P[k].style.opacity=on?.9:0;G[k].style.opacity=on?1:0}
function setState(n){state=n;const x=states[n];$('#status').textContent=x.status;$('#title').textContent=x.title;$('#pwmLabel').textContent=x.on?'PWM HIGH':'PWM LOW';$('#pwmLabel').setAttribute('fill',x.on?'#2563eb':'#ea580c');$('#sw').setAttribute('x2',x.on?'378':'362');$('#sw').setAttribute('y2',x.on?'143':'103');vis('in',x.on);vis('il',1);vis('id',!x.on);vis('load',1);vis('cc',x.cap==='c');vis('cd',x.cap==='d');vis('g1',1);vis('g2',1);vis('g3',x.on);$$('.state').forEach((b,i)=>b.classList.toggle('active',i===n-1))}
function phaseState(p){return p<.25?1:p<.5?2:p<.75?3:4}
function move(path,arr,t,v){if(paused||Number(getComputedStyle(path).opacity)===0)return;const L=path.getTotalLength();arr.forEach((q,i)=>{const u=((t*v)+i/arr.length)%1,p=path.getPointAtLength(u*L);q.setAttribute('cx',p.x);q.setAttribute('cy',p.y)})}
function values(t){const ph=(t%period)/period,pwm=ph<.5?3.3:0,settle=target*(1-Math.exp(-t/tau)),gain=1-Math.exp(-t/1.2),r=.055*gain*Math.sin(2*Math.PI*t/period-.55*Math.PI);return{ph:ph,pwm:pwm,v:Math.max(0,settle+r)}}
function yp(v){return v>1?644:703}function yv(v){return 846-(Math.max(0,Math.min(6,v))/6)*96}
function addHist(t,p,v){pwmHist.push({t:t,v:p});vHist.push({t:t,v:v});const c=t-windowSec;while(pwmHist.length&&pwmHist[0].t<c)pwmHist.shift();while(vHist.length&&vHist[0].t<c)vHist.shift()}
function mkPath(hist,y,now){if(hist.length<2)return'';let out='';hist.forEach((p,i)=>{const x=1040-(now-p.t)/windowSec*850;out+=(i?' L ':'M ')+x.toFixed(1)+' '+y(p.v).toFixed(1)});return out}
function waves(t,p,v){$('#pwmWave').setAttribute('d',mkPath(pwmHist,yp,t));$('#voutWave').setAttribute('d',mkPath(vHist,yv,t));$('#pwmDot').setAttribute('cy',yp(p));$('#voutDot').setAttribute('cy',yv(v));$('#voutNow').textContent=v.toFixed(2)+' V'}
function frame(now){const dt=Math.min(50,now-last)/1000;last=now;if(!paused){sim+=dt;const z=values(sim);if(auto){const n=phaseState(z.ph);if(n!==state)setState(n)}addHist(sim,z.pwm,z.v);waves(sim,z.pwm,z.v)}const t=now/1000;Object.keys(P).forEach(k=>move(P[k],dots[k],t,k.charAt(0)==='g'?.15:.18));requestAnimationFrame(frame)}
$$('.state').forEach(b=>b.addEventListener('click',()=>{auto=false;$('#auto').classList.remove('active');setState(Number(b.dataset.s))}));$('#auto').addEventListener('click',()=>{auto=true;paused=false;$('#auto').classList.add('active');$('#pause').textContent='暂停'});$('#pause').addEventListener('click',()=>{paused=!paused;$('#pause').textContent=paused?'继续':'暂停'});
setState(1);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
